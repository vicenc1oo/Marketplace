# Redirect all plain HTTP traffic to HTTPS.
server {
    listen 80;
    server_name _;

    # The host port for HTTPS will be 8443 in docker-compose.
    return 301 https://$host:8443$request_uri;
}

# Serve the production React build over HTTPS.
server {
    # Nginx listens on port 443 inside the container.
    listen 443 ssl;

    # Accept requests for any hostname.
    server_name _;

    # Self-signed certificate files mounted/copied into the container.
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Folder where the React build files are copied by the Dockerfile.
    root /usr/share/nginx/html;

    # Default file served for the root path.
    index index.html;

    # Forward API requests to the backend service inside the Docker network.
    # Example: /api/auth/login -> http://backend:3000/api/auth/login
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        # Preserve information about the original client request.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward Socket.IO/WebSocket traffic to the backend.
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;

        # Required for WebSocket connections to upgrade from HTTP.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve basic request information for the backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep long-lived socket connections open.
        proxy_read_timeout 60s;
    }

    # Cache Vite hashed assets for a long time.
    # Their filenames change when their content changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback.
    # If the requested path is not a real file, serve index.html
    # and let React handle the route in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow uploads up to 5 MB plus multipart/form-data overhead.
        client_max_body_size 6m;

}
