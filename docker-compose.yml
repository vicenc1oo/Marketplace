services:
  postgres:
    image: postgres:16
    container_name: marketplace-postgres
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketplace
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_secret
      - groq_api_key
    env_file:
      - .env
    environment:
      BACKEND_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      GROQ_MODEL: ${GROQ_MODEL}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-400}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - marketplace
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /
        VITE_USE_MOCKS: "false"
    container_name: marketplace-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    networks:
      - marketplace
    restart: unless-stopped

networks:
  marketplace:
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
  postgres_data:

secrets:
  db_password:
    file: ./.secrets/db_password
  jwt_secret:
    file: ./.secrets/jwt_secret
  groq_api_key:
    file: ./.secrets/groq_api_key